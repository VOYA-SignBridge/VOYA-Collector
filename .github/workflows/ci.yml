# Cổng kiểm: mã này có chạy được không. Không đẩy gì lên đâu cả.
#
# Năm job chạy song song: frontend, backend, wiring (nối dây), images (dựng thử
# ảnh), hygiene (vệ sinh kho). Vì sao có từng bước, và sự cố nào sinh ra nó:
# docs/06-operations/CI_CD.md, mục 2 và 2e.

name: CI

# `son_arrange_repo2` là nhánh thử mã, `main` là nhánh triển khai. Chạy ở mọi lần
# push (trừ `main`/`deploy_ctu_**`: build_docker.yml đã gọi tệp này, và
# `dependabot/**`: PR của nó đã kích hoạt) để người làm nhánh biết hỏng ngay hôm đó.
on:
  push:
    branches-ignore: [main, 'deploy_ctu_**', 'dependabot/**']
  pull_request:
    branches: [main, son_arrange_repo2, 'deploy_ctu_**']
  workflow_dispatch:
  workflow_call:

# Đẩy liên tiếp vài commit thì chỉ lượt cuối cần chạy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — kiểu, test, dựng
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Đúng `npm run typecheck`: `npx tsc --noEmit` dùng tsconfig khác và kiểm 0 tệp.
      - name: Kiểm kiểu
        run: npm run typecheck

      # Cổng phải tự chứng minh mình bắt được lỗi trước (bản đầu luôn báo đạt).
      - name: Cổng i18n tự kiểm
        run: node scripts/i18n-gate.mjs --self-test

      - name: Cổng i18n — không hồi quy
        run: node scripts/i18n-gate.mjs

      - name: Test
        run: npx vitest run --reporter=default --reporter=junit --outputFile=junit-frontend.xml

      # `tsc -b` của bước dựng bắt lỗi mà `typecheck` bỏ sót.
      - name: Dựng
        run: npm run build

      # Lỗi nào cũng đỏ; cảnh báo không vượt trần. Sửa bớt cảnh báo thì hạ trần, đừng nâng.
      - name: Lint (chặn lỗi; cảnh báo không được tăng)
        run: npm run lint -- --max-warnings 54

      - name: Nộp báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-frontend
          path: frontend/junit-frontend.xml

  backend:
    name: Backend — pytest trên CSDL dựng mới
    runs-on: ubuntu-latest

    # Mật khẩu dưới đây chỉ dùng cho CSDL tạm của lượt chạy, không phải bí mật.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          # Phải qua cổng tên của tests/conftest.py (signdb_test | signdb_pytest_*).
          # Đổi tên ở đây, đừng nới cổng.
          POSTGRES_DB: signdb_pytest_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10

    env:
      # Vai ứng dụng và vai điều khiển, như sản xuất (không phải superuser: nó
      # được miễn RLS nên mọi test cách ly sẽ xanh vô nghĩa). provision_db_roles
      # đòi mật khẩu từ 16 ký tự, và hai vai phải khác mật khẩu.
      DATABASE_URL: postgresql://voya_app:ci_password_16_chars_min@localhost:5432/signdb_pytest_ci
      MIGRATION_DATABASE_URL: postgresql://admin:admin@localhost:5432/signdb_pytest_ci
      VOYA_APP_DB_PASSWORD: ci_password_16_chars_min
      VOYA_CONTROL_DB_PASSWORD: ci_control_password_16_min
      CONTROL_DATABASE_URL: postgresql://voya_control:ci_control_password_16_min@localhost:5432/signdb_pytest_ci
      REDIS_URL: redis://localhost:6379/12
      CELERY_BROKER_URL: redis://localhost:6379/12
      CELERY_RESULT_BACKEND: redis://localhost:6379/12
      TTS_REDIS_URL: redis://localhost:6379/12
      PYTHONPATH: ${{ github.workspace }}/backend
      # Cùng hình dạng với địa chỉ thật (Gmail; tên miền bốn cấp) nhưng trên miền
      # ví dụ. conftest chặn SMTP nên không thư nào được gửi.
      VOYA_TEST_EMAIL_GMAIL: ci.gmail.test@example.com
      VOYA_TEST_EMAIL_UNIVERSITY: ci.sinhvien@student.ctu.example.com
      VOYA_TEST_EMAIL_OWNER: ci.owner.test@example.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bước nâng cấp cần mã của bản trước

      # Mã không có khoá mặc định; sinh mới mỗi lượt nên không có gì để lộ.
      - name: Khoá ký JWT ngẫu nhiên cho lượt này
        run: echo "AUTH_TOKEN_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Cài phụ thuộc
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Chỉ CI cài từ số không mỗi lần, nên chỉ ở đây thấy gói gián tiếp trôi.
      - name: Phụ thuộc không xung đột
        run: pip check

      # Đúng lệnh migration của sản xuất (ensure_tables() chỉ THÊM, thiếu phần
      # một chiều). Phiên bản đích hỏi chính mã, không viết cứng ở đây.
      - name: Dựng lược đồ (lệnh migration rõ ràng)
        working-directory: backend
        env:
          EXPECTED_DATABASE: signdb_pytest_ci
        run: |
          target=$(python -c "from app.storage.schema_version import APP_SCHEMA_VERSION; print(APP_SCHEMA_VERSION)")
          echo "luoc do dich: v$target"
          python -m app.cli.migrate --to "$target"

      # Cấp vai bằng CHÍNH lệnh của sản xuất, không GRANT viết tay (GRANT quét
      # sạch sẽ cấp cả bảng điều khiển cho vai ứng dụng). Chạy sau migration.
      - name: Cấp vai ứng dụng và vai điều khiển (đường của sản xuất)
        working-directory: backend
        run: python -m app.cli.provision_db_roles

      - name: Đối chiếu lại tư thế quyền
        working-directory: backend
        run: python -m app.cli.provision_db_roles --check

      # Lược đồ dựng mới phải khớp lược đồ máy đang chạy. Đứng trước pytest để
      # báo thẳng cái thiếu thay vì hàng chục test đỏ rải rác.
      - name: Kiểm nợ lược đồ
        working-directory: backend
        run: |
          python -c "
          from app.storage.metadata_db import schema_debt
          from app.modules.saas.tenant_context import system_scope
          with system_scope('ci: kiem no luoc do'):
              debt = schema_debt()
          print('schema_debt:', debt)
          assert not any(debt.values()), f'luoc do dung moi con no: {debt}'
          "

      # Máy chạy web NÂNG từ lược đồ của bản trước, không dựng từ số không. Dựng
      # một CSDL riêng bằng mã bản trước (cha trên main, hoặc điểm rẽ với main),
      # nâng bằng mã hiện tại, rồi kiểm nợ.
      - name: Nâng cấp từ lược đồ của bản trước
        working-directory: backend
        env:
          UPGRADE_DB: signdb_pytest_upgrade
          PGPASSWORD: admin
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ] && [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            base=$(git rev-parse HEAD^1)
          else
            git fetch --no-tags --quiet origin main
            base=$(git merge-base HEAD origin/main)
          fi
          echo "ban truoc: $(git log -1 --format='%h %s' "$base")"
          psql -h localhost -U admin -d postgres -c "CREATE DATABASE $UPGRADE_DB"
          git worktree add --detach /tmp/ban_truoc "$base"
          dsn="postgresql://admin:admin@localhost:5432/$UPGRADE_DB"
          cu=$(cd /tmp/ban_truoc/backend && PYTHONPATH=/tmp/ban_truoc/backend python -c "from app.storage.schema_version import APP_SCHEMA_VERSION; print(APP_SCHEMA_VERSION)")
          moi=$(python -c "from app.storage.schema_version import APP_SCHEMA_VERSION; print(APP_SCHEMA_VERSION)")
          echo "luoc do: v$cu (ban truoc) -> v$moi (ban nay)"
          (cd /tmp/ban_truoc/backend && PYTHONPATH=/tmp/ban_truoc/backend \
             MIGRATION_DATABASE_URL="$dsn" DATABASE_URL="$dsn" EXPECTED_DATABASE="$UPGRADE_DB" \
             python -m app.cli.migrate --to "$cu")
          MIGRATION_DATABASE_URL="$dsn" DATABASE_URL="$dsn" EXPECTED_DATABASE="$UPGRADE_DB" \
            python -m app.cli.migrate --to "$moi"
          MIGRATION_DATABASE_URL="$dsn" DATABASE_URL="$dsn" python -c "
          from app.storage.metadata_db import schema_debt
          from app.modules.saas.tenant_context import system_scope
          with system_scope('ci: kiem no sau nang cap'):
              debt = schema_debt()
          print('schema_debt sau nang cap:', debt)
          assert not any(debt.values()), f'nang cap tu ban truoc con no: {debt}'
          "
          git worktree remove --force /tmp/ban_truoc

      # Backend gieo danh mục hệ thống lúc khởi động; CI không khởi động backend
      # nên gọi đúng hàm đó.
      - name: Gieo danh mục hệ thống (như lúc khởi động)
        working-directory: backend
        run: |
          python -c "
          from app.modules.saas.tenant_context import system_scope
          from app.modules.dataset.vocabulary_registry import seed_from_csv
          with system_scope('ci: gieo danh muc he thong'):
              print('dialects:', seed_from_csv())
          "

      # Suite chạy bằng ba vai test, cùng script với máy dev (scripts/run_tests.sh).
      - name: Cấp vai test (cùng script với máy dev)
        env:
          VOYA_PG_CONTAINER: "-"
          VOYA_TEST_DATABASE: signdb_pytest_ci
          PGPASSWORD: admin
          VOYA_TEST_OWNER_PASSWORD: ci_test_owner_password_16
          VOYA_TEST_APP_PASSWORD: ci_test_app_password_16_x
          VOYA_TEST_CONTROL_PASSWORD: ci_test_control_password_16
        run: bash scripts/provision_test_db_roles.sh

      # Hai tenant đối kháng iso_a/iso_b; thiếu chúng thì ~30 ca đổ khoá ngoại.
      - name: Gieo fixture cách ly
        working-directory: backend
        env:
          DATABASE_URL: postgresql://voya_test_app:ci_test_app_password_16_x@localhost:5432/signdb_pytest_ci
          MIGRATION_DATABASE_URL: postgresql://voya_test_owner:ci_test_owner_password_16@localhost:5432/signdb_pytest_ci
          CONTROL_DATABASE_URL: postgresql://voya_test_control:ci_test_control_password_16@localhost:5432/signdb_pytest_ci
        run: python ../scripts/seed_isolation_fixture.py

      # VOYA_TEST_VIDEO cố ý không đặt (kho clip 2,7 GB không có ở đây): test
      # trích npz từ video là ca skip duy nhất được chấp nhận.
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql://voya_test_app:ci_test_app_password_16_x@localhost:5432/signdb_pytest_ci
          MIGRATION_DATABASE_URL: postgresql://voya_test_owner:ci_test_owner_password_16@localhost:5432/signdb_pytest_ci
          CONTROL_DATABASE_URL: postgresql://voya_test_control:ci_test_control_password_16@localhost:5432/signdb_pytest_ci
          VOYA_TEST_OWNER_PASSWORD: ci_test_owner_password_16
          VOYA_TEST_APP_PASSWORD: ci_test_app_password_16_x
          VOYA_TEST_CONTROL_PASSWORD: ci_test_control_password_16
          SMTP_HOST: smtp.test.invalid
          POSTGRES_DB: signdb_pytest_ci   # ca đối chứng của test_db_role_isolation đọc biến này
        run: python -m pytest -q --junitxml=junit-backend.xml

      - name: Nộp báo cáo test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-backend
          path: backend/junit-backend.xml

  # Chỗ nối giữa các phần (script ↔ backend, compose ↔ nginx ↔ voya, tài liệu ↔
  # tệp): không bộ test nào đọc chúng, nên hỏng mà không ai hay. Dưới 2 phút.
  wiring:
    name: Nối dây — script, cấu hình, tài liệu khớp với mã
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài công cụ kiểm
        run: python -m pip install --quiet pyyaml

      - name: Workflow GitHub Actions hợp lệ
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color -shellcheck= -pyflakes=

      - name: Mã ngoài backend gọi đúng module app.*
        run: python scripts/check_app_imports.py

      - name: Hợp đồng compose / nginx / voya
        run: python scripts/check_compose_contracts.py

      - name: Tài liệu công khai — không tài liệu riêng, email thật, liên kết hỏng
        run: python scripts/check_docs.py

      - name: Cú pháp Python (backend, processed, scripts)
        run: python -m compileall -q backend processed scripts

      - name: Cú pháp shell
        run: |
          bad=0
          for f in $(git ls-files '*.sh'); do
            bash -n "$f" || { echo "::error file=$f::loi cu phap shell"; bad=1; }
          done
          exit $bad

      # Công cụ chuyển máy viết bằng PowerShell; lỗi cú pháp chỉ lộ vào ngày chuyển máy.
      - name: Cú pháp PowerShell
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in (git ls-files '*.ps1')) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errors)
            if ($errors) { $bad = 1; Write-Output "::error file=$f::$($errors[0].Message)" }
          }
          exit $bad

      # `.env.example` đóng vai `.env`: thiếu biến mà compose đòi thì máy mới cũng thiếu.
      - name: Cấu hình compose gộp được
        run: |
          cp .env.example .env
          for combo in \
            "docker-compose.yml" \
            "docker-compose.yml docker-compose.prod.yml" \
            "docker-compose.yml docker-compose.prod.yml docker-compose.gpu.yml" \
            "docker-compose.yml docker-compose.staging.yml"; do
            args=""; for f in $combo; do args="$args -f $f"; done
            echo "== $combo"
            docker compose $args config -q
          done

      - name: Cấu hình nginx hợp lệ
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx.conf.d:/etc/nginx/conf.d:ro" \
            nginx:alpine nginx -t

  # Dựng thử ba ảnh, không đẩy, để Dockerfile hỏng lộ ra TRƯỚC khi gộp. Trên
  # main/deploy_ctu_** thì bỏ qua: build_docker.yml dựng và đẩy ở đó.
  images:
    name: Dựng thử ảnh — ${{ matrix.name }}
    if: github.event_name == 'pull_request' || !(github.ref_name == 'main' || startsWith(github.ref_name, 'deploy_ctu_'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: voya_backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: voya_frontend
          - name: realtime_service
            context: ./backend/realtime_service
            dockerfile: ./backend/realtime_service/Dockerfile
            image: voya_realtime_service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Dựng (không đẩy)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          # Chỉ ĐỌC cache của main (công khai, không cần đăng nhập); không ghi.
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ matrix.image }}:buildcache

  hygiene:
    name: Vệ sinh kho — thứ mà test không bao giờ bắt được
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Script CRLF chết trong container Linux ("exec: no such file"). Đọc byte
      # ĐÃ CAM KẾT (`i/`), không đọc thư mục làm việc.
      - name: Script shell phải là LF
        run: |
          bad=$(git ls-files --eol -- '*.sh' 'Dockerfile*' '**/Dockerfile*' | grep -E '^i/crlf' || true)
          if [ -n "$bad" ]; then
            echo "::error::Cac tep sau duoc CAM KET voi dau dong CRLF, se hong trong container Linux:"
            echo "$bad" | sed 's/^/  /'
            echo "Sua: git add --renormalize . && git commit"
            exit 1
          fi
          echo "Tat ca script shell va Dockerfile deu duoc cam ket la LF."

      # .gitignore không chặn `git add -f` hay tệp đã lỡ vào kho từ trước.
      - name: Không có bí mật nào bị cam kết
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(prod|production|local)$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Tep bi mat da vao kho:"
            echo "$leaked" | sed 's/^/  - /'
            exit 1
          fi
          echo "Khong co .env nao bi theo doi."

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Backup / deploy contract and safety tests
        run: python -m unittest discover -s scripts/ops/tests -v

      - name: Real isolated PostgreSQL backup / restore drill
        run: python scripts/ops/tests/restore_drill.py
