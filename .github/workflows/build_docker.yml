# Dựng và đẩy ảnh của cả stack, gắn tag truy được về đúng một commit.
#
# Lịch sử của tệp này, vì mỗi thay đổi đều là một lỗi vận hành có thật
# ---------------------------------------------------------------------
# Bản đầu (vẫn đang sống trên `main`) chạy trên **mỗi pull request** và đẩy
# thẳng `voya_backend:latest`. Nghĩa là một PR bất kỳ — chưa ai duyệt, từ bất
# kỳ ai mở được PR — ghi đè đúng cái ảnh máy sản xuất dùng. Nó còn liệt kê
# `:latest` HAI LẦN trong khối `tags`, gần như chắc chắn là dấu vết của một
# dòng `sha-…` từng có rồi bị thay nhầm. Hệ quả: không có cách nào biết một ảnh
# sinh ra từ commit nào — chính là gốc rễ của triệu chứng "container healthy
# nhưng đang chạy mã cũ" đã tốn nhiều lượt chẩn đoán.
#
# Ba thay đổi ở bản này
# ----------------------
# 1. **Đủ ba ảnh, không chỉ backend.** Compose dựng ba ảnh riêng
#    (`voya_backend`, `voya_frontend`, `voya_realtime_service`). Chỉ đẩy
#    backend thì không ai triển khai được từ registry — phải dựng tại chỗ, và
#    "dựng tại chỗ" là lúc mã chạy tách khỏi mã đã qua cổng kiểm.
#
# 2. **`latest` chỉ di chuyển từ `main`.** Nhánh `deploy_ctu_**` vẫn được dựng
#    ảnh, nhưng chỉ nhận tag `sha-…` và `branch-…`. Một commit trên nhánh phát
#    hành vì thế triển khai được (ghim theo sha) mà không bao giờ tự động đổi
#    thứ mà máy sản xuất kéo về.
#
# 3. Tag SHA đầy đủ; CI cùng commit phải pass trước khi phát hành.
#
# Ảnh này dùng ở đâu
# -------------------
# `docker-compose.registry.yml` + `scripts/deploy.py`. Xem
# docs/06-operations/HOST_TRANSFER.md cho backup, chuyển host và cấu hình CD.

name: Build & push images

on:
  push:
    branches:
      - main
      - 'deploy_ctu_**'
  # Cho phép phát hành lại đúng một commit mà không cần commit rỗng.
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  # Never cancel a workflow during the database/production deployment stage.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Một job hỏng không nên giấu kết quả của hai job kia: nếu frontend hỏng
      # ta vẫn muốn biết backend có dựng được không. (`fail-fast` là khoá của
      # `strategy`, không phải của job — đặt sai tầng thì nó bị bỏ qua lặng lẽ.)
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
            image: voya_backend
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image: voya_frontend
          - name: realtime_service
            context: ./backend/realtime_service
            dockerfile: ./backend/realtime_service/Dockerfile
            image: voya_realtime_service

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # `latest` chỉ theo `main`. Trên nhánh phát hành, ảnh vẫn được đẩy nhưng
      # không có tag nào tự di chuyển — muốn dùng thì phải ghim sha một cách
      # tường minh, và sự tường minh đó chính là thứ ta muốn.
      - name: Tính tag
        id: tags
        run: |
          short=$(git rev-parse HEAD)
          ns='${{ secrets.DOCKER_USERNAME }}'
          img="$ns/${{ matrix.image }}"
          branch=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          tags="$img:sha-$short
          $img:branch-$branch"
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            tags="$tags
          $img:latest"
          fi
          {
            echo "short=$short"
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Dựng và đẩy
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.list }}
          # Cache dùng chung theo tên ảnh, không theo nhánh — ba nhánh dựng
          # cùng một backend thì không có lý do gì dựng lại từ đầu ba lần.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Ghi lại ảnh vừa đẩy
        run: |
          {
            echo "### ${{ matrix.image }}"
            echo ""
            echo '```'
            echo "${{ steps.tags.outputs.list }}"
            echo '```'
            echo ""
            echo "Triển khai đúng ảnh này trên máy deploy:"
            echo ""
            echo '```bash'
            echo "python scripts/deploy.py --image-tag sha-${{ steps.tags.outputs.short }} --backup-dir /secure/backups/UNIQUE-NAME --allow-downtime"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Production (opt-in, protected environment)
    needs: [checks, build]
    if: vars.ENABLE_AUTO_DEPLOY == 'true' && github.ref_name == vars.DEPLOY_BRANCH
    runs-on: [self-hosted, linux, voya-prod]
    environment: production
    concurrency:
      group: voya-production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
      BACKUP_ROOT: ${{ vars.BACKUP_ROOT }}
      VOYA_REGISTRY_NS: ${{ secrets.DOCKER_USERNAME }}
      RELEASE_SHA: ${{ github.sha }}
      ACCEPT_EXTERNAL_STORAGE: ${{ vars.ACCEPT_EXTERNAL_STORAGE }}
    steps:
      # No checkout action in the live directory: it can clean untracked data.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Snapshot, pin source, migrate and verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_ROOT" && test -n "$BACKUP_ROOT"
          cd "$DEPLOY_ROOT"
          test -z "$(git status --porcelain --untracked-files=no)"
          git fetch origin "$RELEASE_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          python3 scripts/deploy.py --check
          bundle="$BACKUP_ROOT/${RELEASE_SHA}-$(date -u +%Y%m%dT%H%M%SZ)"
          external=()
          if [ "$ACCEPT_EXTERNAL_STORAGE" = true ]; then external+=(--accept-external-storage); fi
          python3 scripts/backup.py "$bundle" --allow-downtime --keep-stopped "${external[@]}"
          git checkout --detach "$RELEASE_SHA"
          python3 scripts/deploy.py --prepared-backup "$bundle" --image-tag "sha-$RELEASE_SHA" --allow-downtime
