<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>CTU.SignBridge — Đang bảo trì</title>
<style>
  :root { --bg: #f7f8fb; --card: #fff; --text: #1d2433; --muted: #5b6475; --accent: #0b5cad; }
  @media (prefers-color-scheme: dark) { :root { --bg: #11151c; --card: #1a2029; --text: #e7ebf2; --muted: #a2abba; --accent: #6ba8ff; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); max-width: 460px; width: 100%; border-radius: 14px; padding: 32px 28px;
          border: 1px solid rgba(127,127,127,.18); text-align: center; }
  h1 { font-size: 22px; font-weight: 600; margin: 16px 0 8px; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 8px; }
  .dot { width: 44px; height: 44px; margin: 0 auto; border-radius: 50%; border: 4px solid rgba(127,127,127,.2);
         border-top-color: var(--accent); animation: spin 1.1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  small { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="card" role="status">
    <div class="dot" aria-hidden="true"></div>
    <h1>Hệ thống đang được cập nhật</h1>
    <p>CTU.SignBridge đang được cập nhật. Trang sẽ tự mở lại khi cập nhật xong. Dữ liệu của bạn vẫn an toàn.</p>
    <p lang="en">We are updating the system. This page will reopen by itself once the update is done.</p>
    <small>Trang tự tải lại sau mỗi 60 giây.</small>
  </div>
</main>
</body>
</html>
