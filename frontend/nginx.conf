server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API and backend routes to the application backend
    # Adjust the proxy_pass target as appropriate for your deployment:
    # - During local development with nginx container: use http://host.docker.internal:8000
    # - When running backend in another container: use http://backend:8000 (service name)
    # - When backend is on the host and not in container: use http://host.docker.internal:8000
    
    # Upstream backend placeholder (use host.docker.internal or a service name)
    # Note: replace `host.docker.internal:8000` with your actual backend target when deploying
    
    location ~ ^/(api|auth|classes|dataset|jobs|upload)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Serve SPA fallback for other requests (static files and client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|map|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
