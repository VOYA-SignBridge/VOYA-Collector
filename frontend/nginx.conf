server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS, re-resolved every 10s. A literal `proxy_pass
    # http://backend:8000` resolves ONCE at config-parse time, which caused two
    # problems: nginx refused to start at all when backend wasn't up yet (this
    # container crash-looped on a cold boot), and once started it pinned the
    # backend's IP forever — so a backend restart that changed the container IP
    # left this proxy 502-ing until someone restarted it by hand.
    # Using a variable in proxy_pass defers resolution to request time. The
    # variable carries no URI part, so nginx still forwards the original request
    # URI unchanged, exactly as the literal form did.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # Compress text assets (JS/CSS/JSON/SVG). Matters when this container is
    # hit directly; the gateway also gzips, and nginx never double-compresses
    # (it passes through an already-encoded upstream response).
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/wasm image/svg+xml font/ttf font/otf;

    # NOTE: In the docker-compose topology, the top-level "nginx" gateway
    # service (../nginx.conf) is the source of truth for routing — it
    # matches API paths and proxies them straight to the "backend" service
    # before requests ever reach this container. The block below only
    # matters if this frontend container is ever accessed directly,
    # bypassing that gateway (e.g. local `docker run` of this image alone).
    # Keep the path list here in sync with ../nginx.conf if that changes.
    location ~ ^/(api|auth|classes|dataset|health|jobs|upload)(/|$) {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Realtime API only — bare /realtime is an SPA page and must fall through
    # to the try_files fallback below, not be proxied to the backend.
    location ~ ^/realtime/(predict|models|health)$ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # Serve SPA fallback for other requests (static files and client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File do Vite build ra nằm trong /assets/ có chứa mã hash -> an toàn để cache vĩnh viễn
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Các file tĩnh khác nằm ngoài /assets/ (ví dụ từ thư mục public như logo.png, background.png)
    # Không sử dụng immutable, bắt buộc browser phải revalidate để cập nhật ngay lập tức nếu file thay đổi.
    location ~* \.(?:css|js|mjs|map|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
        access_log off;
        expires 1h;
        add_header Cache-Control "public, no-cache, must-revalidate";
    }
}
