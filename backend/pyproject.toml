[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "celery==5.3.1",
    "fastapi==0.95.2",
    "filelock==3.16.1",
    "google-api-python-client>=2.196.0",
    "google-auth-httplib2>=0.4.0",
    "google-auth-oauthlib>=1.4.0",
    "mediapipe==0.10.21",
    "numpy==1.26.2",
    "opencv-python-headless==4.11.0.86",
    "psycopg2-binary==2.9.7",
    "pydantic==1.10.11",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "redis==4.5.1",
    "sqlalchemy==1.4.50",
    "uvicorn[standard]==0.22.0",
    "passlib[bcrypt]==1.7.4",
    "python-jose[cryptography]==3.3.0",
    # Engine quyết định phân quyền. Tên gói trên PyPI là `casbin`, không phải
    # `pycasbin` — `pycasbin` là tên dự án trên GitHub, và `pip install
    # pycasbin` cài một gói khác. KHÔNG kèm adapter cơ sở dữ liệu nào: adapter
    # ở đây tự viết và chỉ-đọc, xem app/authorization/adapter.py về vì sao
    # `casbin_rule` là thứ không được phép tồn tại.
    "casbin==1.36.0"
]

[tool.pytest.ini_options]
# Silence a third-party deprecation we can't act on: starlette's TestClient
# constructs httpx with the deprecated `app=` shortcut. Scoped to that exact
# message so our own future deprecations still surface.
filterwarnings = [
    "ignore:The 'app' shortcut is now deprecated:DeprecationWarning",
]
# Registered so `-m "not integration"` is a supported way to run the suite
# without a live Postgres, and so a typo'd marker name shows up as a warning
# rather than silently selecting nothing.
markers = [
    "integration: needs a live Postgres/Redis (skips cleanly when absent)",
]
