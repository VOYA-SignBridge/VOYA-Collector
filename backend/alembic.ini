# Alembic config for the V2 database (Roadmap v2 - GD1).
# Run from backend/:  ../.venv/Scripts/python -m alembic upgrade head
[alembic]
script_location = migrations
prepend_sys_path = .
# URL is resolved at runtime in migrations/env.py from app.core.config
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
