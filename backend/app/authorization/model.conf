# Mô hình Casbin của CTU-SignBridge — RBAC theo domain.
#
# ĐỌC KỸ TRƯỚC KHI SỬA. Tệp này quyết định câu trả lời ALLOW/DENY cho mọi
# request, và một dòng sai ở đây không làm hệ thống hỏng — nó làm hệ thống
# TRẢ LỜI SAI, im lặng.
#
# r = sub, dom, perm
#   sub   "user:<uuid>"        chủ thể
#   dom   "sys" | "ten:<id>" | "ws:<uuid>" | "prj:<uuid>"
#   perm  "sample.annotate"    mã quyền, đúng `permissions.permission_code`
#
# p = role, perm
#   KHÔNG có domain, và đó là chủ ý. Quan hệ role→quyền độc lập với nơi chốn:
#   "Tenant Admin gồm những quyền này" đúng ở mọi tenant. Chính g mới gắn
#   người vào role TẠI một domain. Nhét domain vào p sẽ nhân bản toàn bộ bảng
#   role_permissions theo số tenant, và mỗi tenant mới thành một lần sao chép
#   policy — chính thứ §21 muốn tránh.
#
# g = _, _, _
#   Quan hệ ba thành phần: (user, role, domain). Đây là thứ cho phép cùng một
#   người mang role khác nhau ở tenant khác nhau.
#
# m
#   `g(r.sub, p.role, r.dom)` hỏi: chủ thể có role này TẠI domain đang xét
#   không. `r.perm == p.perm` là so khớp CHÍNH XÁC, không phải khớp mẫu —
#   `keyMatch` hay regex ở đây sẽ biến `sample.read` thành thứ khớp được
#   `sample.readonly` và mọi mã quyền tương lai bắt đầu bằng cùng tiền tố.
#
# Không có `p.eft`
#   Hiệu ứng chỉ có `some(where (p.eft == allow))`, tức là thuần allow-list và
#   KHÔNG có policy phủ định. Đó là quyết định, không phải thiếu sót: một DENY
#   tường minh sẽ tạo ra thứ tự ưu tiên giữa allow và deny, và §14 đã dựa toàn
#   bộ vào thống trị phạm vi (phạm vi rộng ngụ ý phạm vi hẹp). Trộn hai cơ chế
#   sẽ làm câu "vì sao người này bị từ chối" không còn trả lời được bằng cách
#   nhìn vào một chỗ.

[request_definition]
r = sub, dom, perm

[policy_definition]
p = role, perm

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.role, r.dom) && r.perm == p.perm
