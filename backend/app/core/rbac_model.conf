# Casbin model — RBAC with Domains (erd_v2_unified_design.md §9.2)
# dom = "ws:<uuid>" | "prj:<id>" | "*" (system scope)
# Default-DENY: no matching policy => 403.

[request_definition]
r = sub, dom, obj, act

[policy_definition]
p = sub, dom, obj, act

[role_definition]
g = _, _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub, r.dom) && (p.dom == "*" || r.dom == p.dom) && (r.obj == p.obj || p.obj == "*") && (r.act == p.act || p.act == "*")
