apiVersion: 1

contactPoints:
  - orgId: 1
    name: "Admin Email"
    receivers:
      - uid: admin-email-receiver
        type: email
        settings:
          # Hộp thư NHẬN cảnh báo, lấy từ `ALERT_EMAIL_TO` trong `.env` (Grafana
          # tự thay `$ALERT_EMAIL_TO` lúc nạp tệp). Không ghi địa chỉ ở đây: repo
          # công khai. Chưa đặt thì docker-compose.yml dùng `SMTP_FROM`, rồi
          # `SMTP_USER` (tài khoản gửi), để cảnh báo không rơi vào hư không.
          addresses: $ALERT_EMAIL_TO
          singleEmail: true
          subject: '{{ template "email.voya.subject" . }}'
          message: '{{ template "email.voya.message" . }}'
