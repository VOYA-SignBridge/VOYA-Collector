apiVersion: 1

templates:
  - orgId: 1
    name: email.voya.message
    template: |
      {{ define "email.voya.message" }}
      <div style="font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f4;">
        <div style="background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <h2 style="color: {{ if eq .Status "firing" }}#d9534f{{ else }}#5cb85c{{ end }}; border-bottom: 2px solid #eee; padding-bottom: 10px;">
            {{ if eq .Status "firing" }}🚨 BÁO ĐỘNG HỆ THỐNG{{ else }}✅ ĐÃ KHÔI PHỤC{{ end }}
          </h2>
          <p style="font-size: 16px; color: #333;">
            Hệ thống giám sát VOYA ghi nhận trạng thái mới từ cụm máy chủ:
          </p>
          <table style="width: 100%; border-collapse: collapse; margin: 20px 0;">
            <tr style="background-color: #f9f9f9;">
              <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Cảnh báo</th>
              <td style="padding: 10px; border: 1px solid #ddd;"><b>{{ .CommonLabels.alertname }}</b></td>
            </tr>
            <tr>
              <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Mức độ</th>
              <td style="padding: 10px; border: 1px solid #ddd;">
                <span style="padding: 4px 8px; border-radius: 4px; color: #fff; background-color: {{ if eq .CommonLabels.severity "critical" }}#d9534f{{ else }}#f0ad4e{{ end }};">
                  {{ .CommonLabels.severity }}
                </span>
              </td>
            </tr>
            <tr style="background-color: #f9f9f9;">
              <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Tóm tắt</th>
              <td style="padding: 10px; border: 1px solid #ddd;">{{ .CommonAnnotations.summary }}</td>
            </tr>
            <tr>
              <th style="padding: 10px; border: 1px solid #ddd; text-align: left;">Mô tả</th>
              <td style="padding: 10px; border: 1px solid #ddd;">{{ .CommonAnnotations.description }}</td>
            </tr>
          </table>
          
          <p style="color: #666; font-size: 14px; text-align: center; margin-top: 30px;">
            Hệ thống tự động phát ra từ Grafana - Enterprise VOYA Collector
          </p>
        </div>
      </div>
      {{ end }}
  - orgId: 1
    name: email.voya.subject
    template: |
      {{ define "email.voya.subject" }}[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ end }}
