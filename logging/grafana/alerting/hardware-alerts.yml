apiVersion: 1

# Grafana does NOT remove a rule when it disappears from a provisioning file —
# it stays in grafana_data with provenance "file", invisible in git and
# undeletable through the UI or the provisioning API. "High 5xx Error Rate" is
# one such leftover from an earlier revision: it duplicates "Server 5xx Errors"
# below but with `for: 0s`, so it pages on a single scrape spike. Declaring the
# uid here is the supported way to retire it, and because this lives in git the
# cleanup applies to every machine, not just the one it was noticed on.
deleteRules:
  - orgId: 1
    uid: high-error-rule

groups:
  - orgId: 1
    name: Hardware Alerts
    folder: VOYA Alerts
    interval: 1m
    rules:
      - uid: hw-error-rule
        title: Phần cứng gặp sự cố
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              expr: voya_hardware_error
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 1m
        annotations:
          description: >-
            Một thiết bị (đĩa dữ liệu hoặc GPU) không còn đọc được. Xem nhãn
            `resource` để biết là cái nào, và trang Tài nguyên trong ứng dụng
            để biết nó mất từ lúc nào.
          summary: Không đọc được một thiết bị phần cứng
        labels:
          severity: critical

      - uid: high-cpu-rule
        title: CPU quá tải
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              expr: voya_cpu_usage_percent
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [90], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 1m
        annotations:
          description: >-
            CPU máy chủ trên 90% liên tục hơn một phút. Thường là một lượt
            huấn luyện đang chạy; nếu không có lượt nào thì kiểm tra worker.
          summary: CPU máy chủ trên 90% quá một phút
        labels:
          severity: warning

      - uid: high-traffic-rule
        title: Lưu lượng bất thường
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(rate(http_requests_total[1m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [100], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 1m
        annotations:
          description: >-
            Trên 100 yêu cầu mỗi giây. Với quy mô sử dụng hiện tại đây là mức
            bất thường — có thể là một vòng lặp phía client, hoặc lưu lượng
            không mong muốn từ bên ngoài.
          summary: Trên 100 yêu cầu mỗi giây
        labels:
          severity: critical

      - uid: high-error-rate-rule
        title: Máy chủ trả lỗi 5xx
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 60, to: 0 }
            datasourceUid: prometheus
            model:
              expr: sum(rate(http_requests_total{status=~"5.."}[1m]))
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [5], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 1m
        annotations:
          description: >-
            Hơn 5 lỗi máy chủ mỗi giây. Đây là lỗi PHÍA MÁY CHỦ, không phải do
            người dùng gửi sai — xem log backend trong Loki cùng khoảng thời gian.
          summary: Hơn 5 lỗi máy chủ mỗi giây
        labels:
          severity: critical

      # Availability alerts. Everything above measures a RUNNING system — high
      # CPU, high traffic, 5xx rate — so a backend that is simply dead produced
      # no alert at all: its metrics stop arriving and the threshold rules go
      # quiet, which reads exactly like "healthy". These three watch for the
      # absence instead.
      #
      # Note the inverted noDataState: for the backend probe, "no data" means
      # Prometheus could not scrape it, which is itself the outage — so it must
      # alert rather than resolve. The Redis/Postgres gauges are published BY
      # the backend, so when the backend is down they legitimately have no data
      # and would otherwise double-alert on the same root cause; those stay OK
      # and let the backend rule speak for the outage.
      - uid: backend-down-rule
        title: Backend không phản hồi
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: up{job="voya_backend"}
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              refId: B
              type: classic_conditions
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          description: >-
            Prometheus không lấy được chỉ số từ backend trong hai phút (up == 0
            hoặc không có dữ liệu). Toàn bộ ứng dụng đang không dùng được.
          summary: Backend đã ngừng phản hồi
        labels:
          severity: critical

      - uid: redis-down-rule
        title: Redis không phản hồi
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: voya_redis_up
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          description: >-
            Redis không trả lời PING. Hàng đợi Celery nằm ở đây, nên mọi tác vụ
            nền — đồng bộ Drive, xuất dữ liệu, huấn luyện — đều dừng.
          summary: Redis đã ngừng phản hồi
        labels:
          severity: critical

      - uid: postgres-down-rule
        title: Postgres không phản hồi
        condition: B
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              expr: voya_postgres_up
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              refId: B
              type: classic_conditions
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          description: >-
            Postgres không trả lời SELECT 1. Danh mục lớp, tài khoản và trạng
            thái các lượt huấn luyện đều không đọc được.
          summary: Postgres đã ngừng phản hồi
        labels:
          severity: critical
