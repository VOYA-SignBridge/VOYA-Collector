apiVersion: 1

policies:
  - orgId: 1
    receiver: "Admin Email"
    group_by: ['grafana_folder', 'alertname']
    # 24h, không phải 4h: một sự cố kéo dài (như chuông kiểm toán kêu suốt ba
    # tuần) với 4h là sáu thư mỗi ngày cùng một nội dung — hộp thư thành nơi
    # không ai đọc nữa, và thư có ích chìm theo. Sự cố mới vẫn báo ngay
    # (group_wait 30s); chỉ lời NHẮC LẠI mới thưa ra.
    repeat_interval: 24h
    group_wait: 30s
    group_interval: 5m
