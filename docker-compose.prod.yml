services:
  frontend:
    build:
      context: ./frontend
      args:
        # Empty = same-origin relative API paths, proxied by the nginx
        # gateway (nginx.conf) to the backend on the same domain/port.
        # Only set this if the frontend is served from a different
        # origin than the nginx gateway.
        VITE_API_URL: ${VITE_API_URL:-}
    image: voya_frontend:latest
    container_name: voya_frontend
    mem_limit: 128m
    expose:
      - "80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_frontend
          - frontend

  realtime_service:
    build: ./backend/realtime_service
    image: voya_realtime_service:latest
    container_name: voya_realtime_service
    mem_limit: 800m
    expose:
      - "8010"
    environment:
      NORMALIZATION_PY_PATH: /app/processed/shared/normalization.py
      # Inference device. Default "cpu" — safe while the GPU is busy training.
      # Set REALTIME_DEVICE=cuda (and add a `deploy.resources` GPU reservation
      # like the trainer) to run realtime inference on the GPU when it is free.
      REALTIME_DEVICE: "${REALTIME_DEVICE:-cpu}"
      REALTIME_TORCH_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./backend/realtime_service:/app/realtime_service
      - ./processed/shared:/app/processed/shared:ro
      - ./processed/analysis:/app/processed/analysis:ro
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - realtime_service

  backend:
    build: ./backend
    image: voya_backend:latest
    container_name: voya_backend
    mem_limit: 1200m
    expose:
      - "8000"
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    env_file:
      - .env
    environment:
      REALTIME_SERVICE_URL: http://realtime_service:8010
      TTS_REDIS_URL: redis://redis:6379/0
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    depends_on:
      - postgres
      - redis
      - realtime_service
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_backend
          - backend

  worker:
    image: voya_backend:latest
    container_name: voya_worker
    # Hard RAM ceiling: isolates the video worker so a leak/spike can never
    # starve the parallel GPU trainer or the DB (12GB host budget).
    mem_limit: 2500m
    env_file:
      - .env
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    environment:
      TTS_REDIS_URL: redis://redis:6379/0
      # glibc: cap malloc arenas → stops multithreaded NumPy/OpenCV from
      # inflating RSS with per-thread arenas (biggest fragmentation win).
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    # -c 2: only 2 prefork children (RAM ≈ 2 × MediaPipe/OpenCV base) so the
    #       trainer keeps its share of the 6 cores / 12GB.
    # --max-tasks-per-child: recycle a child after N videos → returns native
    #       memory to the OS (defeats the slow RSS creep).
    # --max-memory-per-child (KB): safety valve — restart a bloated child.
    command: >
      celery -A app.worker.celery_app worker
      -c 2
      --max-tasks-per-child=15
      --max-memory-per-child=1200000
      --loglevel=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
      - postgres
      - backend
    restart: unless-stopped
    networks:
      - voya_network

  # Dedicated training executor — consumes ONLY the "training" queue with
  # concurrency 1 (jobs stay strictly serialized). Isolates heavy
  # training from the API container so requests stay responsive.
  # GPU: train_tcn.py auto-selects cuda when torch.cuda.is_available(),
  # so no code/requirements change is needed — this reservation is what
  # actually exposes the host GPU to the container. Requires the NVIDIA
  # driver + NVIDIA Container Toolkit installed on the host; verify with
  # `docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi`
  # before relying on it. Remove this block to fall back to CPU-only.
  trainer:
    image: voya_backend:latest
    container_name: voya_trainer
    # Largest RAM slice: dataset (.npz features) is materialized into host RAM
    # for training. GPU holds the model/activations; host RAM holds the data.
    # Threads left at default — training data loading benefits from them.
    mem_limit: 3500m
    env_file:
      - .env
    environment:
      MALLOC_ARENA_MAX: "2"
      # train_tcn.py enables torch.use_deterministic_algorithms(True); on
      # CUDA >= 10.2 CuBLAS needs this workspace config or every conv/matmul
      # raises RuntimeError and the job dies at epoch 1.
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: celery -A app.worker.celery_app worker -Q training -c 1 -n trainer@%h --loglevel=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - voya_network

  celery-beat:
    image: voya_backend:latest
    container_name: voya_celery_beat
    mem_limit: 256m
    env_file:
      - .env
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    environment:
      TTS_REDIS_URL: redis://redis:6379/0
    command: celery -A app.worker.celery_app beat --loglevel=${LOG_LEVEL:-INFO} --schedule=/tmp/celerybeat-schedule
    depends_on:
      - redis
      - postgres
      - worker
    restart: unless-stopped
    networks:
      - voya_network

  redis:
    image: redis:7-alpine
    container_name: voya_redis
    mem_limit: 512m
    # Bound Redis memory. volatile-lru evicts only keys WITH a TTL (TTS cache,
    # expiring task results) — broker queue keys have no TTL and are never
    # dropped, so queued Celery tasks are not lost under memory pressure.
    command: redis-server --maxmemory 400mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - voya_network

  postgres:
    image: postgres:17
    container_name: voya_postgres
    mem_limit: 768m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - postgres

  nginx:
    image: nginx:alpine
    container_name: voya_nginx
    mem_limit: 128m
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - nginx
          - voya_nginx

volumes:
  postgres_data:
  redis_data:

networks:
  voya_network:
    driver: bridge
