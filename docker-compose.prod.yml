services:
  frontend:
    build:
      context: ./frontend
    environment:
      - VITE_BASE_PATH=${VITE_BASE_PATH:-/}
      - VITE_API_URL=${VITE_API_URL:-}
    image: voya_frontend:latest
    container_name: ${CONTAINER_PREFIX:-voya}_frontend
    mem_limit: 128m
    expose:
      - "80"
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_frontend
          - frontend

  realtime_service:
    build: ./backend/realtime_service
    image: voya_realtime_service:latest
    container_name: ${CONTAINER_PREFIX:-voya}_realtime_service
    mem_limit: 800m
    stop_grace_period: 20s
    expose:
      - "8010"
    environment:
      NORMALIZATION_PY_PATH: /app/processed/shared/normalization.py
      # Inference device. Default "cpu" — safe while the GPU is busy training.
      # Set REALTIME_DEVICE=cuda (and add a `deploy.resources` GPU reservation
      # like the trainer) to run realtime inference on the GPU when it is free.
      REALTIME_DEVICE: "${REALTIME_DEVICE:-cpu}"
      REALTIME_TORCH_THREADS: "1"
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./backend/realtime_service:/app/realtime_service
      - ./processed/shared:/app/processed/shared:ro
      - ./processed/analysis:/app/processed/analysis:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8010/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - realtime_service

  backend:
    build: ./backend
    image: voya_backend:latest
    container_name: ${CONTAINER_PREFIX:-voya}_backend
    # Measured 917 MB resident at idle (mediapipe + torch + matplotlib imports
    # dominate, and it stays flat there after TTS prewarm). At the old 1200m
    # that was 76% consumed before serving a single request, leaving too little
    # for concurrent uploads. 1500m keeps ~40% free at rest.
    mem_limit: 1500m
    # Drain in-flight HTTP requests on SIGTERM before SIGKILL — an update never
    # cuts off an active user mid-request (uvicorn shuts down gracefully).
    stop_grace_period: 30s
    expose:
      - "8000"
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    env_file:
      - .env
    environment:
      REALTIME_SERVICE_URL: http://realtime_service:8010
      TTS_REDIS_URL: redis://redis:6379/0
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      realtime_service:
        condition: service_started
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_backend
          - backend

  worker:
    image: voya_backend:latest
    # Same build as `backend`: these four run the identical image, just with a
    # different command. Without a build section Compose can only try to PULL
    # voya_backend:latest — which exists nowhere — so a machine that has never
    # built it fails with "pull access denied for voya_backend". It worked on
    # machines where an earlier build had left the tag in the local image cache,
    # which is exactly why it slipped through. Compose builds a shared
    # context+tag once and the rest reuse it, so this costs nothing.
    build: ./backend
    container_name: ${CONTAINER_PREFIX:-voya}_worker
    # Hard RAM ceiling: isolates the video worker so a leak/spike can never
    # starve the parallel GPU trainer or the DB (12GB host budget).
    mem_limit: 2500m
    # Celery warm shutdown: finish the current video task before exiting so an
    # update doesn't discard in-progress processing.
    stop_grace_period: 60s
    env_file:
      - .env
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    environment:
      TTS_REDIS_URL: redis://redis:6379/0
      # glibc: cap malloc arenas → stops multithreaded NumPy/OpenCV from
      # inflating RSS with per-thread arenas (biggest fragmentation win).
      MALLOC_ARENA_MAX: "2"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    # -c 2: only 2 prefork children (RAM ≈ 2 × MediaPipe/OpenCV base) so the
    #       trainer keeps its share of the 6 cores / 12GB.
    # --max-tasks-per-child: recycle a child after N videos → returns native
    #       memory to the OS (defeats the slow RSS creep).
    # --max-memory-per-child (KB): safety valve — restart a bloated child.
    command: >
      celery -A app.worker.celery_app worker
      -c 2
      --max-tasks-per-child=15
      --max-memory-per-child=1200000
      --loglevel=${LOG_LEVEL:-INFO}
    healthcheck:
      # Measured at 10.3s on an IDLE host against the old 12s timeout — the cost
      # is importing the whole app (mediapipe/torch) in a fresh interpreter, not
      # the ping itself. Any real load pushed it over and marked a perfectly
      # healthy worker unhealthy. It also burned ~10s of CPU every 30s forever.
      # 60s interval halves that waste; 30s timeout gives 3x margin.
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --timeout=15 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 90s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - voya_network

  # Dedicated training executor — consumes ONLY the "training" queue with
  # concurrency 1 (jobs stay strictly serialized). Isolates heavy
  # training from the API container so requests stay responsive.
  # GPU: train_tcn.py auto-selects cuda when torch.cuda.is_available(),
  # so no code/requirements change is needed — this reservation is what
  # actually exposes the host GPU to the container. Requires the NVIDIA
  # driver + NVIDIA Container Toolkit installed on the host; verify with
  # `docker run --rm --gpus all nvidia/cuda:12.4.1-base-ubuntu22.04 nvidia-smi`
  # before relying on it. Remove this block to fall back to CPU-only.
  trainer:
    image: voya_backend:latest
    # Same build as `backend`: these four run the identical image, just with a
    # different command. Without a build section Compose can only try to PULL
    # voya_backend:latest — which exists nowhere — so a machine that has never
    # built it fails with "pull access denied for voya_backend". It worked on
    # machines where an earlier build had left the tag in the local image cache,
    # which is exactly why it slipped through. Compose builds a shared
    # context+tag once and the rest reuse it, so this costs nothing.
    build: ./backend
    container_name: ${CONTAINER_PREFIX:-voya}_trainer
    # Largest RAM slice: dataset (.npz features) is materialized into host RAM
    # for training. GPU holds the model/activations; host RAM holds the data.
    # Threads left at default — training data loading benefits from them.
    #
    # Raised from 3500m: a real 8-epoch TCN run over the current 1002-sample /
    # 40-class dataset sat flat at 3.05 GiB — 89% of the old cap — for its whole
    # duration. It survived, but the headroom scales with the dataset and an
    # OOM-kill here loses the entire training job, so give it room to grow.
    mem_limit: 4000m
    # A training job can run for many minutes; don't kill it on a stray stop.
    # Best practice: only update the trainer when no job is running (jobs are
    # serialized, so the admin can drain it first). This grace covers cleanup.
    stop_grace_period: 45s
    env_file:
      - .env
    environment:
      MALLOC_ARENA_MAX: "2"
      # train_tcn.py enables torch.use_deterministic_algorithms(True); on
      # CUDA >= 10.2 CuBLAS needs this workspace config or every conv/matmul
      # raises RuntimeError and the job dies at epoch 1.
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    # GPU reservation lives in docker-compose.gpu.yml, not here.
    #
    # `driver: nvidia` is not a hint — Docker resolves it at container-create
    # time, so on any host without the NVIDIA Container Toolkit this service
    # died immediately with `could not select device driver "nvidia" with
    # capabilities: [[gpu]]`, taking the deploy with it. That is every laptop and
    # every CPU-only server, i.e. exactly the machines used for a demo.
    #
    # train_tcn.py already selects CUDA via torch.cuda.is_available(), so the
    # CPU fallback needs no code change. On a GPU host, add the extra file:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
    #                  -f docker-compose.gpu.yml up -d --build
    # --max-tasks-per-child=1: recycle the supervisor child after every training
    # job so any memory it touched is returned to the OS immediately ("trả liền").
    # The GPU is already freed by the training subprocess exiting; this covers the
    # Python supervisor process too.
    command: celery -A app.worker.celery_app worker -Q training -c 1 --max-tasks-per-child=1 -n trainer@%h --loglevel=${LOG_LEVEL:-INFO}
    # Ping is answered by the worker's control thread even mid-training (training
    # runs in a subprocess), so a long job won't flap this. Health never triggers
    # a restart in plain Compose, so it can't kill a running job either.
    healthcheck:
      # Measured at 10.3s on an IDLE host against the old 12s timeout — the cost
      # is importing the whole app (mediapipe/torch) in a fresh interpreter, not
      # the ping itself. Any real load pushed it over and marked a perfectly
      # healthy worker unhealthy. It also burned ~10s of CPU every 30s forever.
      # 60s interval halves that waste; 30s timeout gives 3x margin.
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --timeout=15 >/dev/null 2>&1 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 90s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - voya_network

  celery-beat:
    image: voya_backend:latest
    # Same build as `backend`: these four run the identical image, just with a
    # different command. Without a build section Compose can only try to PULL
    # voya_backend:latest — which exists nowhere — so a machine that has never
    # built it fails with "pull access denied for voya_backend". It worked on
    # machines where an earlier build had left the tag in the local image cache,
    # which is exactly why it slipped through. Compose builds a shared
    # context+tag once and the rest reuse it, so this costs nothing.
    build: ./backend
    container_name: ${CONTAINER_PREFIX:-voya}_celery_beat
    mem_limit: 256m
    env_file:
      - .env
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    environment:
      TTS_REDIS_URL: redis://redis:6379/0
    command: celery -A app.worker.celery_app beat --loglevel=${LOG_LEVEL:-INFO} --schedule=/tmp/celerybeat-schedule
    # Beat has no worker to inspect — verify it can reach the Redis broker it
    # publishes schedules to (that is the only thing that can break it).
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import redis,os; redis.from_url(os.environ.get('CELERY_BROKER_URL','redis://redis:6379/0')).ping()\" || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      worker:
        condition: service_started
    restart: unless-stopped
    networks:
      - voya_network

  redis:
    image: redis:7-alpine
    container_name: ${CONTAINER_PREFIX:-voya}_redis
    mem_limit: 512m
    # Bound Redis memory. volatile-lru evicts only keys WITH a TTL (TTS cache,
    # expiring task results) — broker queue keys have no TTL and are never
    # dropped, so queued Celery tasks are not lost under memory pressure.
    command: redis-server --maxmemory 400mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - voya_network

  postgres:
    image: postgres:17
    container_name: ${CONTAINER_PREFIX:-voya}_postgres
    mem_limit: 768m
    # Give Postgres time for a clean shutdown (flush + checkpoint) before
    # SIGKILL — protects data integrity on stop/update.
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - postgres

  nginx:
    image: nginx:alpine
    container_name: ${CONTAINER_PREFIX:-voya}_nginx
    mem_limit: 128m
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      # NOTE: no :443 mapping. The TLS vhost added in 8c21320 is no longer in
      # nginx.conf (nothing inside the container listens on 443) and certs/ is
      # empty, so the mapping only served to make the container fail to start
      # wherever 443 was already taken — which is the normal case on a shared
      # host. TLS is terminated by the campus proxy in front of this gateway.
      # To serve TLS here again: restore the `listen 443 ssl` server block,
      # generate certs/ , then add "${NGINX_HTTPS_PORT:-443}:443" back.
      # Loopback-only: see the note in docker-compose.yml. On the CTU host these
      # two would otherwise be reachable from the campus network and would skip
      # every limit_req zone the :80 gateway applies.
      - "${DEBUG_BIND_HOST:-127.0.0.1}:${NGINX_BACKEND_PORT:-8000}:8000"
      - "${DEBUG_BIND_HOST:-127.0.0.1}:${NGINX_HEALTH_PORT:-8001}:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    # Check the plain-HTTP listener (:80 serves 200); the :443 HTTP/2+TLS vhost
    # rejects a localhost handshake (no SNI/cert match) so it's not a usable probe.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:80/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - nginx
          - voya_nginx

volumes:
  postgres_data:
  redis_data:

networks:
  voya_network:
    driver: bridge
