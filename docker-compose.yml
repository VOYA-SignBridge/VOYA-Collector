services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_MIRROR_PREVIEW: ${VITE_MIRROR_PREVIEW:-0}
        VITE_SWAP_HANDEDNESS: ${VITE_SWAP_HANDEDNESS:-1}
        VITE_DEBUG_HANDS: ${VITE_DEBUG_HANDS:-0}
        VITE_STT_MODE: ${VITE_STT_MODE:-browser}
        VITE_STT_LANG: ${VITE_STT_LANG:-vi-VN}
    image: voya_frontend:latest
    container_name: voya_frontend
    expose:
      - "80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_frontend
          - frontend

  backend:
    build: ./backend
    image: voya_backend:latest
    container_name: voya_backend
    expose:
      - "8000"
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_backend
          - backend

  worker:
    image: voya_backend:latest
    container_name: voya_worker
    env_file:
      - .env
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
    command: celery -A app.worker.celery_app worker --loglevel=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
      - postgres
      - backend
    restart: unless-stopped
    networks:
      - voya_network

  redis:
    image: redis:7-alpine
    container_name: voya_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - voya_network

  postgres:
    image: postgres:17
    container_name: voya_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - postgres

  nginx:
    image: nginx:alpine
    container_name: voya_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - nginx
          - voya_nginx

volumes:
  postgres_data:
  redis_data:

networks:
  voya_network:
    driver: bridge
