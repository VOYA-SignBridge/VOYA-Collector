services:
  frontend:
    build:
      context: ./frontend
      args:
        # Do not bake a localhost backend URL into the frontend build by default.
        # Leave empty so the frontend uses same-origin relative paths when possible.
        VITE_API_URL: ${VITE_API_URL:-}
    image: voya_frontend:latest
    container_name: voya_frontend
    expose:
      - "80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_frontend
          - frontend

  realtime_service:
    build: ./backend/realtime_service
    image: voya_realtime_service:latest
    container_name: voya_realtime_service
    expose:
      - "8010"
    environment:
      NORMALIZATION_PY_PATH: /app/processed/shared/normalization.py
    volumes:
      - ./backend/realtime_service:/app/realtime_service
      - ./processed/shared:/app/processed/shared:ro
      - ./processed/analysis:/app/processed/analysis:ro
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - realtime_service

  backend:
    build: ./backend
    image: voya_backend:latest
    container_name: voya_backend
    expose:
      - "8000"
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    env_file:
      - .env
    environment:
      REALTIME_SERVICE_URL: http://realtime_service:8010
      TTS_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - realtime_service
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_backend
          - backend

  worker:
    image: voya_backend:latest
    container_name: voya_worker
    env_file:
      - .env
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    environment:
      TTS_REDIS_URL: redis://redis:6379/0
    command: celery -A app.worker.celery_app worker --loglevel=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
      - postgres
      - backend
    restart: unless-stopped
    networks:
      - voya_network

  celery-beat:
    image: voya_backend:latest
    container_name: voya_celery_beat
    env_file:
      - .env
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    environment:
      TTS_REDIS_URL: redis://redis:6379/0
    command: celery -A app.worker.celery_app beat --loglevel=${LOG_LEVEL:-INFO} --schedule=/tmp/celerybeat-schedule
    depends_on:
      - redis
      - postgres
      - worker
    restart: unless-stopped
    networks:
      - voya_network

  redis:
    image: redis:7-alpine
    container_name: voya_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - voya_network

  postgres:
    image: postgres:17
    container_name: voya_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - postgres

  nginx:
    image: nginx:alpine
    container_name: voya_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - nginx
          - voya_nginx

volumes:
  postgres_data:
  redis_data:

networks:
  voya_network:
    driver: bridge
