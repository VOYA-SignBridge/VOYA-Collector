services:
  frontend:
    build: ./voya-frontend
    image: tamb2203579/voya_frontend:latest
    container_name: voya_frontend
    expose:
      - "80"
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_frontend
          - frontend

  backend:
    build: ./voya-backend/backend
    image: tamb2203579/voya_backend:latest
    container_name: voya_backend
    expose:
      - "8000"
    volumes:
      - voya_dataset:/dataset
    env_file:
      - .env
    depends_on:
      - redis
      - minio
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_backend
          - backend

  worker:
    build: ./voya-backend/backend
    image: tamb2203579/voya_backend:latest
    container_name: voya_worker
    env_file:
      - .env
    volumes:
      - voya_dataset:/dataset
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
    networks:
      - voya_network

  redis:
    image: redis:6.2
    container_name: voya_redis
    restart: unless-stopped
    networks:
      - voya_network

  minio:
    image: minio/minio:latest
    container_name: voya_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - voya_minio:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - minio
          - voya_minio

  nginx:
    image: nginx:alpine
    container_name: voya_nginx
    ports:
      - "80:80"
      - "8001:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - nginx
          - voya_nginx

volumes:
  voya_dataset:
  voya_minio:

networks:
  voya_network:
    driver: bridge
