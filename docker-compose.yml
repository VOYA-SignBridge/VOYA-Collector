services:
  frontend:
    build: ./frontend
    image: voya_frontend:latest
    container_name: voya_frontend
    expose:
      - "80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_frontend
          - frontend

  backend:
    build: ./backend
    image: voya_backend:latest
    container_name: voya_backend
    expose:
      - "8000"
    volumes:
      - ../dataset:/dataset
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_backend
          - backend

  worker:
    image: voya_backend:latest
    container_name: voya_worker
    env_file:
      - .env
    volumes:
      - ../dataset:/dataset
    command: celery -A app.worker.celery_app worker --loglevel=info
    depends_on:
      - redis
      - postgres
      - backend
      - minio
    restart: unless-stopped
    networks:
      - voya_network

  redis:
    image: redis:latest
    container_name: voya_redis
    restart: unless-stopped
    networks:
      - voya_network

  minio:
    image: minio/minio:latest
    container_name: voya_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - voya_minio:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - minio
          - voya_minio

  postgres:
    image: postgres:latest
    container_name: voya_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - postgres

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: voya_pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - pgadmin
          - voya_pgadmin

  nginx:
    image: nginx:alpine
    container_name: voya_nginx
    ports:
      - "80:80"
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - nginx
          - voya_nginx

volumes:
  voya_minio:
  postgres_data:
  pgadmin_data:

networks:
  voya_network:
    driver: bridge
