services:
  frontend:
    build:
      context: ./frontend
      args:
        # Do not bake a localhost backend URL into the frontend build by default.
        # Leave empty so the frontend uses same-origin relative paths when possible.
        VITE_API_URL: ${VITE_API_URL:-}
    image: voya_frontend:latest
    container_name: voya_frontend
    expose:
      - "80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_frontend
          - frontend

  realtime_service:
    build: ./backend/realtime_service
    image: voya_realtime_service:latest
    container_name: voya_realtime_service
    expose:
      - "8010"
    environment:
      NORMALIZATION_PY_PATH: /app/processed/shared/normalization.py
    volumes:
      - ./backend/realtime_service:/app/realtime_service
      - ./processed/shared:/app/processed/shared:ro
      - ./processed/analysis:/app/processed/analysis:ro
      # Model architectures, so promoted non-TCN checkpoints can be served by the
      # SAME class that trained them. Self-contained (torch only); `processed` and
      # `processed.train_utils` resolve as namespace packages.
      - ./processed/train_utils/models:/app/processed/train_utils/models:ro
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - realtime_service

  backend:
    build: ./backend
    image: voya_backend:latest
    container_name: voya_backend
    expose:
      - "8000"
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    env_file:
      - .env
    environment:
      REALTIME_SERVICE_URL: http://realtime_service:8010
      TTS_REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
      - realtime_service
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - voya_backend
          - backend

  worker:
    image: voya_backend:latest
    container_name: voya_worker
    env_file:
      - .env
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    environment:
      TTS_REDIS_URL: redis://redis:6379/0
    command: celery -A app.worker.celery_app worker --loglevel=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
      - postgres
      - backend
    restart: unless-stopped
    networks:
      - voya_network

  # Dedicated training executor — consumes ONLY the "training" queue with
  # concurrency 1 (jobs stay strictly serialized). Isolates CPU-heavy
  # training from the API container so requests stay responsive.
  trainer:
    image: voya_backend:latest
    container_name: voya_trainer
    env_file:
      - .env
    environment:
      # train_tcn.py enables torch.use_deterministic_algorithms(True); on
      # CUDA >= 10.2 CuBLAS needs this workspace config or every conv/matmul
      # raises RuntimeError and the job dies at epoch 1.
      CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    # GPU: train_tcn.py auto-selects cuda when torch.cuda.is_available(), so no
    # code/requirements change is needed — this reservation is what exposes the
    # host GPU to the container. Requires the NVIDIA driver + NVIDIA Container
    # Toolkit on the host; verify with
    # `docker run --rm --gpus all voya_backend:latest python -c "import torch;print(torch.cuda.is_available())"`.
    # Remove this block (and CUBLAS_WORKSPACE_CONFIG above) to fall back to CPU-only.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # --max-tasks-per-child=1: recycle the supervisor child after every training
    # job so any memory it touched is returned to the OS immediately ("trả liền").
    # The GPU is already freed by the training subprocess exiting; this covers the
    # Python supervisor process too.
    command: celery -A app.worker.celery_app worker -Q training -c 1 --max-tasks-per-child=1 -n trainer@%h --loglevel=${LOG_LEVEL:-INFO}
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - voya_network

  celery-beat:
    image: voya_backend:latest
    container_name: voya_celery_beat
    env_file:
      - .env
    volumes:
      - ./dataset:/dataset
      - ./gdrive:/gdrive
      - .:/workspace
    environment:
      TTS_REDIS_URL: redis://redis:6379/0
    command: celery -A app.worker.celery_app beat --loglevel=${LOG_LEVEL:-INFO} --schedule=/tmp/celerybeat-schedule
    depends_on:
      - redis
      - postgres
      - worker
    restart: unless-stopped
    networks:
      - voya_network

  redis:
    image: redis:7-alpine
    container_name: voya_redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - voya_network

  postgres:
    image: postgres:17
    container_name: voya_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - postgres

  nginx:
    image: nginx:alpine
    container_name: voya_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      voya_network:
        aliases:
          - nginx
          - voya_nginx

volumes:
  postgres_data:
  redis_data:

networks:
  voya_network:
    driver: bridge
