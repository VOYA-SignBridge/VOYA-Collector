# Cổng vào của môi trường kiểm thử trình duyệt: giao diện mới dựng + backend tạm.
# Danh sách tiền tố API khớp `server.proxy` trong frontend/vite.config.ts, cộng hai
# đường tải lên (`/upload` trần là trang giao diện nên không proxy cả tiền tố).
server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 50m;

    location ~ ^/(api|auth|classes|dataset|health|inference|jobs|upload/camera|upload/video)(/|$) {
        proxy_pass http://${BACKEND}:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        try_files $uri /index.html;
    }
}
