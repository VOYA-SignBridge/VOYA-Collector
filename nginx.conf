user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 75;
    send_timeout 900s;
    client_body_timeout 900s;
    client_max_body_size 2048m;
    proxy_connect_timeout 120s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    # Docker embedded DNS. Re-resolve upstream IPs every 10s so container
    # restarts (which change container IPs) don't cause persistent 502s.
    # Requires variables in proxy_pass — static upstream{} blocks resolve
    # DNS only once at config load.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Map for CORS headers
    map $http_origin $cors_header {
        default "";
        ~. $http_origin;
    }

    # Frontend + API Gateway (Port 80)
    server {
        listen 80;

        client_max_body_size 1024m;

        # Variable form forces per-request DNS resolution (see resolver above)
        set $frontend_upstream http://frontend:80;
        set $backend_upstream http://backend:8000;

        # Health check endpoint
        location ~ ^/health(/|$) {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes → Backend (CORS handled by FastAPI CORSMiddleware)
        location ~ ^/(api/v1|auth|classes|dataset|inference|jobs) {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Realtime API endpoints go through the backend gateway first.
        # The backend performs request validation and then forwards to the
        # realtime inference service.
        location ~ ^/realtime/(predict|models|health)$ {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;

        }

        # Upload endpoints
        location ~ ^/upload/(camera|video)$ {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Realtime page (SPA route, not API) → Frontend
        location = /realtime {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (catch-all)
        location / {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend API (Port 8000 - for direct backend access)
    server {
        listen 8000;

        client_max_body_size 1024m;

        set $backend_upstream http://backend:8000;

        location / {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }
    }

    # Health check (for Docker)
    server {
        listen 8001;

        location / {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}