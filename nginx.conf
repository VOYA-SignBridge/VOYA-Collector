user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75;
    send_timeout 900s;

    # Compress text assets at the edge. The frontend ships ~550KB of
    # uncompressed JS/CSS on first load; gzip cuts that to ~160KB (~70%),
    # which is the single biggest first-paint win. gzip_proxied any lets
    # nginx compress responses proxied from the frontend container too.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;
    client_body_timeout 900s;
    client_max_body_size 2048m;
    proxy_connect_timeout 120s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    # Docker embedded DNS. Re-resolve upstream IPs every 10s so container
    # restarts (which change container IPs) don't cause persistent 502s.
    # Requires variables in proxy_pass — static upstream{} blocks resolve
    # DNS only once at config load.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Who is "the client"? Resolved ONCE here, then used both as the rate-limit
    # key below and as the X-Real-IP this gateway stamps on every proxied
    # request — so nginx and the backend can never disagree about it.
    #
    # Behind the CTU campus reverse proxy the TCP peer ($remote_addr) is the
    # PROXY, shared by every user, so a per-peer limit would throttle the whole
    # campus as one client. Hence the forwarding headers. But they are not
    # equally trustworthy:
    #
    #   X-Forwarded-For  — Cloudflare APPENDS the real client to whatever the
    #                      caller already put there. A request sent with
    #                      "X-Forwarded-For: 1.2.3.4" reaches us as
    #                      "1.2.3.4, <real client>", so the FIRST hop is chosen
    #                      by the caller. Rotating it per request makes every
    #                      request look like a brand-new client.
    #   CF-Connecting-IP — Cloudflare OVERWRITES this one unconditionally. It
    #                      cannot be forged through the tunnel.
    #
    # That difference matters more than it looks: client_ip() in the backend
    # feeds the login brute-force lockout AND activity.get_block(), the admin's
    # IP ban list. Keying those off a caller-controlled value means a banned
    # address just keeps going. Prefer CF-Connecting-IP, fall back to the XFF
    # first hop for the campus-proxy deploy (no Cloudflare in front), and to the
    # socket peer for direct/dev connections.
    #
    # KNOWN GAP, and it is only the fallback: with no CF-Connecting-IP the XFF
    # first hop is still whatever the caller typed — measured at 0/40 requests
    # rate-limited while rotating a fake first hop, versus 26/40 once
    # CF-Connecting-IP is present. Closing that path needs the address of the
    # proxy actually in front, which differs per deployment, so it cannot be
    # hardcoded here. On the CTU server add, with the campus proxy's real IP:
    #     set_real_ip_from <campus-proxy-ip>;
    #     real_ip_header   X-Forwarded-For;
    #     real_ip_recursive on;
    # nginx then rewrites $remote_addr to the last hop NOT in that trusted set,
    # which a caller cannot influence.
    map $http_x_forwarded_for $client_xff {
        default                  $remote_addr;
        "~^\s*(?<xff1>[^,\s]+)"  $xff1;
    }
    map $http_cf_connecting_ip $rl_client {
        ""       $client_xff;
        default  $http_cf_connecting_ip;
    }

    # Edge flood cap for the auth endpoints (login/register/forgot/reset).
    # Coarse first layer: 5 req/s per real client with a burst of 10, then 429.
    # The backend's Redis limiter does the fine-grained per-identifier
    # brute-force lockout; this just stops raw request floods cheaply.
    limit_req_zone $rl_client zone=auth_limit:10m rate=5r/s;
    # Wide global cap for the rest of the API so runaway spam/click loops get
    # throttled, while a normal user (even live recognition at ~10 req/s) stays
    # far below it: 30 req/s per real client, burst 60.
    limit_req_zone $rl_client zone=api_limit:10m rate=30r/s;
    limit_req_status 429;

    # Map for CORS headers
    map $http_origin $cors_header {
        default "";
        ~. $http_origin;
    }

    # Scheme the BROWSER used. TLS is terminated upstream (campus proxy, ngrok,
    # cloudflared) and that hop speaks plain HTTP to this gateway, so $scheme is
    # always "http" here — forwarding it verbatim told the backend an HTTPS
    # session was insecure, which is what made emailed links come out as http://
    # and would keep session cookies un-Secure on a TLS deploy. Honor the header
    # the fronting proxy set (first hop of a possible chain); fall back to
    # $scheme for direct connections that have no such proxy.
    # X-Forwarded-Host is set from $host on every proxied location below.
    # public_url.request_host() prefers that header over Host, and nginx does not
    # strip unknown request headers — so without this a client could send its own
    # X-Forwarded-Host and outrank the value nginx put in Host. The allowlist
    # still refused anything unknown, but that made it the ONLY thing standing
    # between a forged header and a password-reset link; overwriting the header
    # here means the client cannot choose the host at all.
    map $http_x_forwarded_proto $fwd_proto {
        default                       $scheme;
        "~^\s*(?<xfp1>https?)\s*(,|$)" $xfp1;
    }

    # Frontend + API Gateway (HTTP :80; optional HTTP/2 over TLS :443)
    server {
        listen 80;


        client_max_body_size 1024m;

        # Emit relative Location headers (e.g. "/voya/" instead of
        # "http://host/voya/"). This gateway listens on plain HTTP behind the
        # campus TLS proxy, so nginx would otherwise rebuild redirects with its
        # own scheme and port — turning https://se.cit.ctu.edu.vn/voya into a
        # 301 to http://se.cit.ctu.edu.vn/voya/, downgrading the scheme on the
        # one URL users actually type. A relative Location keeps whatever
        # scheme, host and port the browser already had.
        absolute_redirect off;

        # Variable form forces per-request DNS resolution (see resolver above)
        set $frontend_upstream http://frontend:80;
        set $backend_upstream http://backend:8000;

        # --- Sub-path deploy (/voya) — defensive prefix strip -----------------
        # The CTU server serves this app under https://se.cit.ctu.edu.vn/voya/.
        # Depending on how the campus proxy forwards, requests may reach this
        # gateway either WITH the "/voya" prefix (campus proxy keeps it) or
        # WITHOUT it (campus proxy already stripped it). Stripping it here too
        # makes routing identical in BOTH cases — and is a no-op for the root
        # (this machine / ngrok) deploy, where no path ever starts with /voya.
        location = /voya { return 301 /voya/; }
        location ^~ /voya/ {
            rewrite ^/voya/(.*)$ /$1 last;   # re-run matching on the stripped path
        }

        # Health check endpoint
        location ~ ^/health(/|$) {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $rl_client;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Auth endpoints — same backend, but rate-limited at the edge. Must come
        # BEFORE the generic API location so nginx (first-matching regex wins)
        # applies the limit here instead of the unlimited block below.
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $rl_client;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # API routes → Backend (CORS handled by FastAPI CORSMiddleware)
        location ~ ^/(api/v1|auth|classes|dataset|inference|jobs) {
            # Wide per-client flood cap (auth endpoints matched their own tighter
            # block above, so this covers the general API + realtime predict).
            limit_req zone=api_limit burst=60 nodelay;
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $rl_client;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Realtime API endpoints go through the backend gateway first.
        # The backend performs request validation and then forwards to the
        # realtime inference service.
        location ~ ^/realtime/(predict|models|health)$ {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $rl_client;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;

        }

        # Upload endpoints. The trailing (/|$) keeps sub-paths such as
        # /upload/video/process on the backend; a bare $ sent them to the
        # frontend catch-all, which cannot answer them.
        location ~ ^/upload/(camera|video)(/|$) {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $rl_client;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;

        }

        # Realtime page (SPA route, not API) → Frontend
        location = /realtime {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $rl_client;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        # Frontend (catch-all)
        location / {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $rl_client;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
        }
    }

    # Backend API (Port 8000 - for direct backend access)
    #
    # This vhost bypasses the /voya routing of the :80 gateway, so it must carry
    # the SAME rate limits — otherwise it is a way to reach the login endpoint
    # with no flood cap at all. The zones are shared with :80 (declared once at
    # http level), so a client is counted across both ports rather than getting
    # a fresh budget per port. Defence in depth: compose also binds this port to
    # 127.0.0.1, but the limits must not depend on that binding staying put.
    server {
        listen 8000;

        client_max_body_size 1024m;

        set $backend_upstream http://backend:8000;

        # Tighter cap for auth endpoints; must precede the catch-all location.
        location ~ ^/(api/v1/auth|auth)/ {
            limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $rl_client;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;
        }

        location / {
            limit_req zone=api_limit burst=60 nodelay;

            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $rl_client;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $fwd_proto;
            proxy_set_header X-Forwarded-Host $host;

        }
    }

    # Health check (for Docker)
    server {
        listen 8001;

        location / {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}