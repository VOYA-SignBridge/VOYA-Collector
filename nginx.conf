user nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 75;
    send_timeout 900s;

    # Compress text assets at the edge. The frontend ships ~550KB of
    # uncompressed JS/CSS on first load; gzip cuts that to ~160KB (~70%),
    # which is the single biggest first-paint win. gzip_proxied any lets
    # nginx compress responses proxied from the frontend container too.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml
        font/ttf
        font/otf;
    client_body_timeout 900s;
    client_max_body_size 2048m;
    proxy_connect_timeout 120s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;

    # Docker embedded DNS. Re-resolve upstream IPs every 10s so container
    # restarts (which change container IPs) don't cause persistent 502s.
    # Requires variables in proxy_pass — static upstream{} blocks resolve
    # DNS only once at config load.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Edge flood cap for the auth endpoints (login/register/forgot/reset).
    # Coarse first layer: 5 req/s per client with a burst of 10, then 429.
    # The backend's Redis limiter does the fine-grained per-identifier
    # brute-force lockout; this just stops raw request floods cheaply.
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;
    limit_req_status 429;

    # Map for CORS headers
    map $http_origin $cors_header {
        default "";
        ~. $http_origin;
    }

    # Frontend + API Gateway (HTTP :80; optional HTTP/2 over TLS :443)
    server {
        listen 80;
        # NOTE: TLS/:443 is DISABLED here on purpose. The self-signed cert is
        # delivered by a `./certs` bind-mount, which on Docker Desktop (Windows)
        # silently desyncs after a container restart — an empty mount makes
        # `ssl_certificate` fail to load, and because nginx validates the whole
        # config globally, that `[emerg]` takes the ENTIRE gateway down,
        # including the critical port 80 (web + ngrok upstream). Port 80 must
        # never depend on a flaky optional cert. To re-enable HTTPS reliably,
        # bake the cert into an nginx image (or use a named volume) instead of a
        # host bind-mount, then restore the four lines below.
        #   listen 443 ssl;
        #   http2 on;
        #   ssl_certificate     /etc/nginx/certs/server.crt;
        #   ssl_certificate_key /etc/nginx/certs/server.key;
        #   ssl_protocols TLSv1.2 TLSv1.3;
        #   ssl_session_cache shared:SSL:10m;
        #   ssl_session_timeout 1d;

        client_max_body_size 1024m;

        # Variable form forces per-request DNS resolution (see resolver above)
        set $frontend_upstream http://frontend:80;
        set $backend_upstream http://backend:8000;

        # Health check endpoint
        location ~ ^/health(/|$) {
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints — same backend, but rate-limited at the edge. Must come
        # BEFORE the generic API location so nginx (first-matching regex wins)
        # applies the limit here instead of the unlimited block below.
        location ~ ^/api/v1/auth/ {
            limit_req zone=auth_limit burst=10 nodelay;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API routes → Backend (CORS handled by FastAPI CORSMiddleware)
        location ~ ^/(api/v1|auth|classes|dataset|inference|jobs) {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Realtime API endpoints go through the backend gateway first.
        # The backend performs request validation and then forwards to the
        # realtime inference service.
        location ~ ^/realtime/(predict|models|health)$ {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;

        }

        # Upload endpoints
        location ~ ^/upload/(camera|video)$ {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }

        # Realtime page (SPA route, not API) → Frontend
        location = /realtime {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend (catch-all)
        location / {
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Backend API (Port 8000 - for direct backend access)
    server {
        listen 8000;

        client_max_body_size 1024m;

        set $backend_upstream http://backend:8000;

        location / {
            proxy_pass $backend_upstream;
            proxy_request_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 120s;
            proxy_send_timeout 900s;
            proxy_read_timeout 900s;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

        }
    }

    # Health check (for Docker)
    server {
        listen 8001;

        location / {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
    }
}